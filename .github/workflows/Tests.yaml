name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-scraper:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: scraper/pyproject.toml
          architecture: x64

      - name: Install dependencies (and project)
        working-directory: scraper
        run: |
          pip install -U pip
          pip install -e .[test,scripts]

      - name: Run the tests
        working-directory: scraper
        run: inv coverage --args "-vvv"

      - name: Upload coverage report to codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: openzim/freecodecamp

  build-scraper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: scraper/pyproject.toml
          architecture: x64

      - name: Ensure we can build Python targets
        working-directory: scraper
        run: |
          pip install -U pip build
          python3 -m build --sdist --wheel

  build-and-test-zimui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: zimui/.node-version

      - name: Enable corepack
        run: |
          npm install -g corepack
          corepack enable

      - name: Install dependencies
        working-directory: zimui
        run: |
          yarn install --immutable

      - name: Test
        working-directory: zimui
        run: |
          yarn test:unit:run

      - name: Build
        working-directory: zimui
        run: |
          yarn build

      - name: Start web server
        working-directory: zimui
        run: |
          yarn preview &

      - name: Wait for web server to be ready
        run: |
          npx wait-on http://localhost:4173

  # this job replaces the standard "build_docker" job since it builds the docker image
  run-integration-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build the Docker image
        run: |
          docker build -t local-freecodecamp .

      - name: Ensure we can start the Docker image
        run: |
          docker run --rm local-freecodecamp fcc2zim --version

      - name: Ensure zimui and its dependencies are included in the Docker image
        run: |
          docker run --rm local-freecodecamp python -c "from pathlib import Path; import fcc2zim; path = Path(fcc2zim.__file__).parent / 'zimui'; assert (path / 'index.html').is_file() and (path / 'assets').is_dir(), 'zimui not found'"

      - name: Run scraper
        run: |
          mkdir -p output
          docker run --rm -v "$PWD/output:/output" local-freecodecamp fcc2zim \
            --course debugging \
            --language eng \
            --name fcc_en_debugging_test \
            --title "FCC Debugging Test" \
            --description "Test ZIM for integration tests" \
            --zim-file tests_en_debugging.zim

      - name: Archive ZIM
        uses: actions/upload-artifact@v4
        with:
          name: tests_en_debugging.zim
          path: output/tests_en_debugging.zim
          retention-days: 7

      - name: Run zimcheck
        run: |
          docker run --rm -v "$PWD/output:/output" \
            ghcr.io/openzim/zim-tools:3.8.0 zimcheck /output/tests_en_debugging.zim

      - name: Run integration test suite
        run: |
          docker run --rm \
            -v "$PWD/scraper/tests-integration:/src/scraper/tests-integration:ro" \
            -v "$PWD/output:/output:ro" \
            -e ZIM_FILE_PATH=/output/tests_en_debugging.zim \
            local-freecodecamp \
            bash -c "pip install --no-cache-dir pytest && pytest -v /src/scraper/tests-integration"
