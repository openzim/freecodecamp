name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-scraper:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: scraper/pyproject.toml
          architecture: x64

      - name: Install dependencies (and project)
        working-directory: scraper
        run: |
          pip install -U pip
          pip install -e .[test,scripts]

      - name: Run the tests
        working-directory: scraper
        run: inv coverage --args "-vvv"

      - name: Upload coverage report to codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: openzim/freecodecamp

  build-scraper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: scraper/pyproject.toml
          architecture: x64

      - name: Ensure we can build Python targets
        working-directory: scraper
        run: |
          pip install -U pip build
          python3 -m build --sdist --wheel

  build-and-test-zimui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: zimui/.node-version

      - name: Enable corepack
        run: |
          npm install -g corepack
          corepack enable

      - name: Install dependencies
        working-directory: zimui
        run: |
          yarn install --immutable

      - name: Test
        working-directory: zimui
        run: |
          yarn test:unit:run

      - name: Build
        working-directory: zimui
        run: |
          yarn build

      - name: Start web server
        working-directory: zimui
        run: |
          yarn preview &

      - name: Wait for web server to be ready
        run: |
          npx wait-on http://localhost:4173

  # this job replaces the standard "build_docker" job since it builds the docker image
  run-integration-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build the Docker image
        run: |
          docker build -t local-freecodecamp .

      - name: Ensure we can start the Docker image
        run: |
          docker run --rm local-freecodecamp fcc2zim --version

      - name: Ensure zimui and its dependencies are included in the Docker image
        run: |
          docker run --rm local-freecodecamp python -c "from pathlib import Path; import fcc2zim; path = Path(fcc2zim.__file__).parent / 'zimui'; assert (path / 'index.html').is_file() and (path / 'assets').is_dir(), 'zimui not found'"

      - name: Run scraper
        run: |
          mkdir -p output
          docker run --rm -v "$PWD/output:/output" local-freecodecamp fcc2zim \
            --course debugging,project-euler-problems-101-to-200 \
            --language eng \
            --name fcc_en_integration_test \
            --title "FCC Integration Test" \
            --description "Test ZIM for integration tests" \
            --zim-file tests_en_integration.zim

      - name: Archive ZIM
        uses: actions/upload-artifact@v4
        with:
          name: tests_en_integration.zim
          path: output/tests_en_integration.zim
          retention-days: 7

      - name: Run zimcheck
        run: |
          docker run --rm -v "$PWD/output:/output" \
            ghcr.io/openzim/zim-tools:3.8.0 zimcheck /output/tests_en_integration.zim

      - name: Run integration test suite (ZIM structure)
        run: |
          docker run --rm \
            -v "$PWD/scraper/tests-integration/structure:/src/scraper/tests-integration/structure:ro" \
            -v "$PWD/output:/output:ro" \
            -e ZIM_FILE_PATH=/output/tests_en_integration.zim \
            local-freecodecamp \
            bash -c "pip install --no-cache-dir pytest && pytest -v /src/scraper/tests-integration/structure"

  # Builds on the ZIM produced by run-integration-tests to check that content actually
  # renders as expected (e.g. MathJax typesetting math-heavy challenges fully offline,
  # see openzim/freecodecamp#57 and #158). Runs directly on the runner (not the scraper
  # Docker image) since it needs a browser.
  run-rendering-tests:
    runs-on: ubuntu-24.04
    needs: run-integration-tests
    steps:
      - uses: actions/checkout@v7

      - name: Download ZIM
        uses: actions/download-artifact@v4
        with:
          name: tests_en_integration.zim
          path: output

      - name: Dump ZIM content
        run: |
          mkdir -p dumped
          docker run --rm -v "$PWD/output:/output" -v "$PWD/dumped:/dumped" \
            ghcr.io/openzim/zim-tools:3.8.0 \
            zimdump dump --dir=/dumped /output/tests_en_integration.zim

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: scraper/pyproject.toml
          architecture: x64

      - name: Install dependencies
        working-directory: scraper
        run: |
          pip install -U pip
          pip install -e .[test-integration-rendering]
          playwright install --with-deps chromium

      - name: Start web server
        run: |
          python -m http.server 8080 --directory dumped &

      - name: Wait for web server to be ready
        run: |
          npx wait-on http://localhost:8080/index.html

      - name: Run integration test suite (rendering)
        working-directory: scraper
        env:
          RENDERING_TEST_BASE_URL: http://localhost:8080
        run: |
          pytest -v tests-integration/rendering
